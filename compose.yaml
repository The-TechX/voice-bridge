services:
  voice-bridge:
    build: .
    container_name: voice-bridge
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VOICE_BRIDGE_PORT:-8765}:8000"
    environment:
      FISH_API_KEY: ${FISH_API_KEY:-}
      FISH_REFERENCE_ID: ${FISH_REFERENCE_ID:-}
      VAPID_PRIVATE_KEY: /app/data/vapid_private.pem
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:push@tchx.dev}
      VOICE_BRIDGE_DATA_DIR: /app/data
      AGENT_URL: ${AGENT_URL:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
      STT_URL: ${STT_URL:-}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    networks:
      - voice-services

networks:
  voice-services:
    external: true
