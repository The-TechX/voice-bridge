<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TCHX Voice Bridge</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1117; color: #f0f6fc; }
    main { width: min(720px, calc(100% - 32px)); }
    .card { border: 1px solid #30363d; border-radius: 18px; padding: 24px; background: #161b22; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    p { color: #8b949e; margin-top: 0; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 14px 16px; font: inherit; font-weight: 700; cursor: pointer; background: #f0f6fc; color: #0d1117; }
    button.listening { background: #ff7b72; color: #0d1117; }
    #status { min-height: 24px; margin: 14px 0 0; font-size: .92rem; color: #8b949e; }
    .label { margin: 22px 0 8px; font-size: .85rem; color: #8b949e; }
    #transcript { min-height: 150px; white-space: pre-wrap; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; padding: 14px; line-height: 1.5; }
    #interim { color: #8b949e; }
    code { font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>TCHX Voice Bridge</h1>
      <p>Incremento 1 · Speech-to-text desde la app web</p>

      <button id="listen">🎙 Empezar a escuchar</button>
      <div id="status">Listo.</div>

      <div class="label">Transcripción</div>
      <div id="transcript"><span id="final"></span><span id="interim"></span></div>
    </section>
  </main>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const button = document.querySelector('#listen');
    const status = document.querySelector('#status');
    const finalText = document.querySelector('#final');
    const interimText = document.querySelector('#interim');

    if (!SpeechRecognition) {
      button.disabled = true;
      status.textContent = 'Este navegador no expone Web Speech Recognition. Prueba Chrome o Edge.';
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-MX';
      recognition.continuous = true;
      recognition.interimResults = true;

      let listening = false;
      let committed = '';

      recognition.onstart = () => {
        listening = true;
        button.classList.add('listening');
        button.textContent = '■ Detener';
        status.textContent = 'Escuchando…';
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            committed += text.trim() + ' ';
          } else {
            interim += text;
          }
        }
        finalText.textContent = committed;
        interimText.textContent = interim;
      };

      recognition.onerror = (event) => {
        status.textContent = `STT error: ${event.error}`;
      };

      recognition.onend = () => {
        listening = false;
        button.classList.remove('listening');
        button.textContent = '🎙 Empezar a escuchar';
        interimText.textContent = '';
        if (!status.textContent.startsWith('STT error')) {
          status.textContent = 'Detenido.';
        }
      };

      button.addEventListener('click', () => {
        if (listening) recognition.stop();
        else recognition.start();
      });
    }
  </script>
</body>
</html>
