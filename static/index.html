<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>TCHX Voice</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0b;
      --panel: #111214;
      --line: #25272b;
      --text: #f5f7fa;
      --muted: #8d939d;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100svh; }

    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 44px;
    }

    .brand { font-size: 14px; font-weight: 600; letter-spacing: .08em; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #45d79c; }

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
      padding: 24px 0;
    }

    .eyebrow { color: var(--muted); font-size: 13px; }
    h1 { margin: 0; font-size: clamp(30px, 9vw, 48px); font-weight: 500; letter-spacing: -.03em; }
    .sub { margin: 0; max-width: 320px; color: var(--muted); font-size: 15px; line-height: 1.5; }

    .mic {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .mic:active,
    .mic.listening {
      transform: scale(.96);
      background: #1a1c20;
      border-color: #4b4f56;
    }

    .mic svg { width: 42px; height: 42px; }

    .hint { color: var(--muted); font-size: 12px; }

    .transcript-card {
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 16px;
      padding: 14px 15px;
      text-align: left;
    }

    .transcript-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .transcript {
      min-height: 24px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .interim { color: var(--muted); }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 36px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (min-width: 720px) {
      main { padding-left: 32px; padding-right: 32px; }
      .center { gap: 20px; }
      .mic { width: 136px; height: 136px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">TCHX VOICE</div>
      <div class="status"><span class="dot"></span><span>Connected</span></div>
    </header>

    <section class="center">
      <div class="eyebrow">Browser speech recognition</div>
      <h1 id="headline">Push to talk</h1>
      <p class="sub" id="subline">Press and hold the button while you speak. Release to stop.</p>

      <button class="mic" id="mic" aria-label="Press and hold to talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v3"></path>
        </svg>
      </button>

      <div class="hint">Hold to speak · release to stop</div>

      <div class="transcript-card">
        <div class="transcript-head"><span>Transcript</span><span id="state">Ready</span></div>
        <div class="transcript"><span id="final"></span><span class="interim" id="interim"></span></div>
      </div>
    </section>

    <footer>
      <span>STT ready</span>
      <span>Private via Tailscale</span>
    </footer>
  </main>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const mic = document.querySelector('#mic');
    const headline = document.querySelector('#headline');
    const subline = document.querySelector('#subline');
    const state = document.querySelector('#state');
    const finalText = document.querySelector('#final');
    const interimText = document.querySelector('#interim');

    let recognition;
    let listening = false;
    let committed = '';

    async function requestMicrophonePermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
        state.textContent = 'Ready';
      } catch {
        state.textContent = 'Permission needed';
        subline.textContent = 'Allow microphone access, then press and hold to speak.';
      }
    }

    if (!SpeechRecognition) {
      mic.disabled = true;
      headline.textContent = 'Speech recognition unavailable';
      subline.textContent = 'Use Chrome or Edge for this experiment.';
      state.textContent = 'Unsupported';
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        listening = true;
        mic.classList.add('listening');
        headline.textContent = 'Listening';
        subline.textContent = 'Keep holding while you speak.';
        state.textContent = 'Listening';
      };

      recognition.onresult = event => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;
          if (event.results[i].isFinal) committed += text.trim() + ' ';
          else interim += text;
        }
        finalText.textContent = committed;
        interimText.textContent = interim;
      };

      recognition.onerror = event => {
        if (event.error !== 'aborted') state.textContent = `Error: ${event.error}`;
      };

      recognition.onend = () => {
        listening = false;
        mic.classList.remove('listening');
        interimText.textContent = '';
        headline.textContent = 'Push to talk';
        subline.textContent = 'Press and hold the button while you speak. Release to stop.';
        if (!state.textContent.startsWith('Error')) state.textContent = 'Ready';
      };

      const start = event => {
        event.preventDefault();
        if (!listening) {
          try { recognition.start(); } catch {}
        }
      };

      const stop = event => {
        event.preventDefault();
        if (listening) recognition.stop();
      };

      mic.addEventListener('pointerdown', start);
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => mic.addEventListener(type, stop));
      mic.addEventListener('keydown', event => {
        if ((event.code === 'Space' || event.code === 'Enter') && !event.repeat) start(event);
      });
      mic.addEventListener('keyup', event => {
        if (event.code === 'Space' || event.code === 'Enter') stop(event);
      });

      window.addEventListener('load', requestMicrophonePermission, { once: true });
    }

    const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audioContext = AudioContextClass ? new AudioContextClass() : null;
    const pendingAudio = [];
    let voiceSocket;
    let audioUnlocked = false;

    async function unlockAudio() {
      if (!audioContext) return;
      try {
        if (audioContext.state !== 'running') await audioContext.resume();
        audioUnlocked = audioContext.state === 'running';
        if (audioUnlocked) {
          state.textContent = listening ? 'Listening' : 'Ready';
          while (pendingAudio.length) {
            await playAudioBuffer(pendingAudio.shift());
          }
        }
      } catch {
        state.textContent = 'Audio permission needed';
      }
    }

    async function playAudioBuffer(arrayBuffer) {
      if (!audioContext || !audioUnlocked) {
        pendingAudio.push(arrayBuffer);
        state.textContent = 'Tap to enable audio';
        return;
      }

      try {
        const decoded = await audioContext.decodeAudioData(arrayBuffer.slice(0));
        const source = audioContext.createBufferSource();
        source.buffer = decoded;
        source.connect(audioContext.destination);
        source.start();
      } catch {
        state.textContent = 'Audio playback failed';
      }
    }

    document.addEventListener('pointerdown', unlockAudio, { passive: true });
    document.addEventListener('keydown', unlockAudio);

    function connectVoiceChannel() {
      voiceSocket = new WebSocket(`${wsProtocol}://${location.host}/ws`);
      voiceSocket.binaryType = 'arraybuffer';

      voiceSocket.onopen = () => {
        voiceSocket.send('ready');
      };

      voiceSocket.onmessage = event => {
        if (event.data instanceof ArrayBuffer) {
          playAudioBuffer(event.data);
          return;
        }

        if (event.data instanceof Blob) {
          event.data.arrayBuffer().then(playAudioBuffer);
        }
      };

      voiceSocket.onclose = () => {
        setTimeout(connectVoiceChannel, 1500);
      };
    }

    connectVoiceChannel();
  </script>
</body>
</html>
