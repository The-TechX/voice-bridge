<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TCHX Voice" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <title>TCHX Voice</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0b;
      --panel: #111214;
      --line: #25272b;
      --text: #f5f7fa;
      --muted: #8d939d;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100svh; }

    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 44px;
    }

    .brand { font-size: 14px; font-weight: 600; letter-spacing: .08em; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #45d79c; }

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
      padding: 24px 0;
    }

    .eyebrow { color: var(--muted); font-size: 13px; }
    h1 { margin: 0; font-size: clamp(30px, 9vw, 48px); font-weight: 500; letter-spacing: -.03em; }
    .sub { margin: 0; max-width: 320px; color: var(--muted); font-size: 15px; line-height: 1.5; }

    .mic {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .mic:active,
    .mic.listening {
      transform: scale(.96);
      background: #1a1c20;
      border-color: #4b4f56;
    }

    .mic svg { width: 42px; height: 42px; }

    .hint { color: var(--muted); font-size: 12px; }

    .alert-button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .alert-button.enabled {
      color: #45d79c;
      border-color: #2e6952;
    }

    .notify-button {
      display: none;
      border: 1px solid #4b4f56;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .notify-button.visible { display: inline-flex; align-items: center; gap: 8px; }


    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 36px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (min-width: 720px) {
      main { padding-left: 32px; padding-right: 32px; }
      .center { gap: 20px; }
      .mic { width: 136px; height: 136px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">TCHX VOICE</div>
      <div class="status"><span class="dot"></span><span>Connected</span></div>
    </header>

    <section class="center">
      <div class="eyebrow">Browser speech recognition</div>
      <h1 id="headline">Push to talk</h1>
      <p class="sub" id="subline">Press and hold the button while you speak. Release to stop.</p>

      <button class="mic" id="mic" aria-label="Press and hold to talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v3"></path>
        </svg>
      </button>

      <div class="hint">Hold to speak · release to stop</div>
      <div class="hint" id="state">Ready</div>
      <button class="alert-button" id="alerts" type="button">Enable alerts</button>
      <button class="notify-button" id="notify" type="button">▶ Play notification</button>

    </section>

    <footer>
      <span>Local STT ready</span>
      <span>Private via Tailscale</span>
    </footer>
  </main>

  <script>
    const mic = document.querySelector('#mic');
    const headline = document.querySelector('#headline');
    const subline = document.querySelector('#subline');
    const state = document.querySelector('#state');
    const alertsButton = document.querySelector('#alerts');
    const notifyButton = document.querySelector('#notify');

    let listening = false;
    let recordingRequested = false;
    let mediaRecorder = null;
    let mediaStream = null;
    let audioChunks = [];
    let pendingMessageId = null;
    let incomingMessageId = null;
    let microphoneGranted = false;
    const voiceAudio = new Audio();
    let voiceAudioUrl = null;
    let voiceAudioReady = false;
    const agentSessionKey = 'tchxVoiceAgentSessionId';
    let agentSessionId = localStorage.getItem(agentSessionKey);
    if (!agentSessionId) {
      agentSessionId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
      localStorage.setItem(agentSessionKey, agentSessionId);
    }

    async function ensureMicrophonePermission() {
      if (microphoneGranted) return true;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
        microphoneGranted = true;
        return true;
      } catch {
        state.textContent = 'Microphone permission needed';
        subline.textContent = 'Allow microphone access to use push to talk.';
        return false;
      }
    }

    async function enableVoiceAudio() {
      if (voiceAudioReady) return;
      try {
        voiceAudio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
        await voiceAudio.play();
        voiceAudio.pause();
        voiceAudio.currentTime = 0;
        voiceAudioReady = true;
      } catch {}
    }

    function resetMicUi() {
      listening = false;
      mic.classList.remove('listening');
      headline.textContent = 'Push to talk';
      subline.textContent = 'Press and hold the button while you speak. Release to stop.';
    }

    function stopMediaStream() {
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }

    async function transcribeAudio(blob) {
      const pipelineStarted = performance.now();
      const metrics = { pipeline_started_ms: pipelineStarted };
      state.textContent = 'Transcribing';
      const form = new FormData();
      const type = blob.type || 'application/octet-stream';
      const extension = type.includes('mp4') ? 'm4a' : type.includes('webm') ? 'webm' : type.includes('ogg') ? 'ogg' : 'audio';
      form.append('file', blob, `speech.${extension}`);

      try {
        const response = await fetch('/stt/transcribe', { method: 'POST', body: form });
        if (!response.ok) throw new Error(`STT returned ${response.status}`);
        const payload = await response.json();
        metrics.stt_complete_ms = performance.now();
        const text = (payload.text || '').trim();
        if (text) await sendToAgent(text, pipelineStarted, payload.timing || {}, metrics);

        else state.textContent = 'Ready';
      } catch (error) {
        console.error(error);
        state.textContent = 'STT unavailable';
      }
    }

    async function startRecording(event) {
      event.preventDefault();
      if (listening || recordingRequested) return;
      recordingRequested = true;
      enableVoiceAudio();

      const allowed = await ensureMicrophonePermission();
      if (!allowed || !recordingRequested) {
        recordingRequested = false;
        return;
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (!recordingRequested) {
          stopMediaStream();
          return;
        }
        audioChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream);
        mediaRecorder.ondataavailable = event => {
          if (event.data && event.data.size) audioChunks.push(event.data);
        };
        mediaRecorder.onerror = event => {
          console.error(event.error || event);
          state.textContent = 'Recording failed';
          resetMicUi();
          stopMediaStream();
        };
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || audioChunks[0]?.type || 'application/octet-stream' });
          mediaRecorder = null;
          audioChunks = [];
          stopMediaStream();
          resetMicUi();
          if (blob.size) await transcribeAudio(blob);
          else state.textContent = 'Ready';
        };
        mediaRecorder.start();
        listening = true;
        mic.classList.add('listening');
        headline.textContent = 'Listening';
        subline.textContent = 'Keep holding while you speak.';
        state.textContent = 'Listening';
      } catch (error) {
        console.error(error);
        recordingRequested = false;
        stopMediaStream();
        resetMicUi();
        state.textContent = 'Microphone unavailable';
      }
    }

    function stopRecording(event) {
      event.preventDefault();
      recordingRequested = false;
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      else if (!listening) resetMicUi();
    }

    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      mic.disabled = true;
      headline.textContent = 'Audio recording unavailable';
      subline.textContent = 'This browser does not support microphone recording.';
      state.textContent = 'Unsupported';
    } else {
      mic.addEventListener('pointerdown', startRecording);
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => mic.addEventListener(type, stopRecording));
      mic.addEventListener('keydown', event => {
        if ((event.code === 'Space' || event.code === 'Enter') && !event.repeat) startRecording(event);
      });
      mic.addEventListener('keyup', event => {
        if (event.code === 'Space' || event.code === 'Enter') stopRecording(event);
      });
      window.addEventListener('load', ensureMicrophonePermission, { once: true });
    }

    async function sendToAgent(text, pipelineStarted, sttTiming = {}, metrics = {}) {
      metrics.agent_started_ms = performance.now();
      state.textContent = 'Thinking';
      try {
        const response = await fetch('/agent/turn/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: agentSessionId, text }),
        });
        if (!response.ok) throw new Error(`Agent returned ${response.status}`);
        const payload = await response.json();
        metrics.agent_complete_ms = performance.now();
        const output = (payload.agent?.output || '').trim();
        if (!output) {
          state.textContent = 'Ready';
          return;
        }
        if (payload.agent?.spoken) {
          console.info('[voice-pipeline]', {
            stt_ms: sttTiming.stt_ms,
            agent_endpoint_ms: Math.round(metrics.agent_complete_ms - metrics.agent_started_ms),
            agent_model_ms: payload.timing?.model_ms,
            agent_ttft_ms: payload.timing?.ttft_ms,
            tts_total_ms: payload.timing?.tts_total_ms,
            chunks: payload.timing?.chunks,
            time_to_first_audio_ms: sttTiming.stt_ms + (payload.timing?.first_audio_ms || 0),
            time_to_agent_complete_ms: Math.round(metrics.agent_complete_ms - pipelineStarted),
            total_until_agent_return_ms: Math.round(performance.now() - pipelineStarted),
            streaming_chunks: true,
          });
          state.textContent = 'Speaking';
          return;
        }

        metrics.tts_started_ms = performance.now();
        state.textContent = 'Synthesizing';
        const speakResponse = await fetch('/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: output }),
        });
        if (!speakResponse.ok) throw new Error(`TTS returned ${speakResponse.status}`);
        const speakPayload = await speakResponse.json();
        metrics.tts_complete_ms = performance.now();
        const totalMs = Math.round(metrics.tts_complete_ms - pipelineStarted);
        console.info('[voice-pipeline]', {
          stt_ms: sttTiming.stt_ms,
          agent_endpoint_ms: payload.timing?.agent_ms,
          agent_model_ms: payload.agent?.model_elapsed_ms ?? payload.agent?.elapsed_ms,
          tts_ms: speakPayload.timing?.tts_ms,
          broadcast_ms: speakPayload.timing?.broadcast_ms,
          time_to_agent_complete_ms: Math.round(metrics.agent_complete_ms - pipelineStarted),
          time_to_audio_broadcast_ms: totalMs,
          total_ms: totalMs,
        });
        state.textContent = 'Speaking';
      } catch (error) {
        console.error(error);
        state.textContent = 'Agent unavailable';
      }
    }

    const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
    let voiceSocket;

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        alertsButton.disabled = true;
        alertsButton.textContent = 'Alerts unsupported';
        return null;
      }
      const registration = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      await navigator.serviceWorker.ready;
      return registration;
    }

    async function refreshAlertState() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
        alertsButton.disabled = true;
        alertsButton.textContent = 'Alerts unsupported';
        return;
      }
      try {
        const registration = await registerServiceWorker();
        const subscription = await registration.pushManager.getSubscription();
        if (subscription && Notification.permission === 'granted') {
          alertsButton.textContent = 'Alerts enabled';
          alertsButton.classList.add('enabled');
        }
      } catch {
        alertsButton.textContent = 'Enable alerts';
      }
    }

    async function enableAlerts() {
      try {
        const registration = await registerServiceWorker();
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          alertsButton.textContent = 'Alerts blocked';
          return;
        }

        const keyResponse = await fetch('/push/public-key');
        if (!keyResponse.ok) throw new Error('Push key unavailable');
        const { public_key: publicKey } = await keyResponse.json();

        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey),
          });
        }

        const response = await fetch('/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscription.toJSON()),
        });
        if (!response.ok) throw new Error('Subscription failed');

        alertsButton.textContent = 'Alerts enabled';
        alertsButton.classList.add('enabled');
        state.textContent = 'Alerts ready';
      } catch (error) {
        console.error(error);
        state.textContent = 'Alert setup failed';
      }
    }

    alertsButton.addEventListener('click', enableAlerts);

    async function acknowledgeMessage(messageId) {
      if (!messageId) return;
      try {
        await fetch(`/messages/${encodeURIComponent(messageId)}/ack`, { method: 'POST' });
        if ('clearAppBadge' in navigator) await navigator.clearAppBadge();
      } catch {}
    }

    async function playAudioBuffer(arrayBuffer, messageId = null) {
      if (voiceAudioUrl) URL.revokeObjectURL(voiceAudioUrl);
      voiceAudioUrl = URL.createObjectURL(new Blob([arrayBuffer], { type: 'audio/mpeg' }));
      voiceAudio.src = voiceAudioUrl;
      voiceAudio.onended = () => {
        if (voiceAudioUrl) URL.revokeObjectURL(voiceAudioUrl);
        voiceAudioUrl = null;
        acknowledgeMessage(messageId);
        state.textContent = 'Ready';
      };
      voiceAudio.onerror = () => {
        if (voiceAudioUrl) URL.revokeObjectURL(voiceAudioUrl);
        voiceAudioUrl = null;
      };

      state.textContent = messageId ? 'Playing alert' : 'Speaking';
      try {
        await voiceAudio.play();
      } catch (error) {
        console.error(error);
        state.textContent = 'Tap once to enable audio';
      }
    }

    async function playMessage(messageId) {
      if (!messageId) return;
      try {
        const response = await fetch(`/messages/${encodeURIComponent(messageId)}/audio`, { cache: 'no-store' });
        if (!response.ok) throw new Error('Message audio unavailable');
        await playAudioBuffer(await response.arrayBuffer(), messageId);
      } catch (error) {
        console.error(error);
        state.textContent = 'Alert playback failed';
      }
    }

    function showPendingNotification(messageId) {
      if (!messageId) return;
      pendingMessageId = messageId;
      notifyButton.classList.add('visible');
      state.textContent = 'Notification waiting';
    }

    function clearPendingNotification() {
      pendingMessageId = null;
      notifyButton.classList.remove('visible');
    }

    async function discoverPendingMessage() {
      const params = new URLSearchParams(location.search);
      const requestedId = params.get('message');
      if (requestedId) {
        showPendingNotification(requestedId);
        history.replaceState({}, '', '/');
        return;
      }

      try {
        const response = await fetch('/messages/pending', { cache: 'no-store' });
        if (!response.ok) return;
        const { message } = await response.json();
        if (message?.id) showPendingNotification(message.id);
      } catch {}
    }

    notifyButton.addEventListener('click', async () => {
      if (!pendingMessageId) return;
      const messageId = pendingMessageId;
      await playMessage(messageId);
      clearPendingNotification();
    });


    function connectVoiceChannel() {
      voiceSocket = new WebSocket(`${wsProtocol}://${location.host}/ws`);
      voiceSocket.binaryType = 'arraybuffer';

      voiceSocket.onopen = () => {
        voiceSocket.send('ready');
      };

      voiceSocket.onmessage = event => {
        if (typeof event.data === 'string') {
          try {
            const message = JSON.parse(event.data);
            if (message.type === 'voice-message' && message.message_id) {
              incomingMessageId = message.message_id;
            }
          } catch {}
          return;
        }

        const messageId = incomingMessageId;
        incomingMessageId = null;
        if (event.data instanceof ArrayBuffer) {
          playAudioBuffer(event.data, messageId);
          return;
        }
        if (event.data instanceof Blob) {
          event.data.arrayBuffer().then(buffer => playAudioBuffer(buffer, messageId));
        }
      };

      voiceSocket.onclose = () => {
        setTimeout(connectVoiceChannel, 1500);
      };
    }

    connectVoiceChannel();
    refreshAlertState();
    discoverPendingMessage();
  </script>
</body>
</html>
